name: Chess challenge release checks

on:
  push:
    paths:
      - 'challenge/**'
      - '.github/workflows/challenge.yml'
  pull_request:
    paths:
      - 'challenge/**'
      - '.github/workflows/challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: challenge/frontend/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r backend/test_requirements.txt
      - name: Verify backend
        working-directory: challenge/backend
        run: python -m pytest -q
      - name: Verify frontend and build
        working-directory: challenge/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Build deployment image
        run: docker build -t chess-model-challenge:ci .
      - name: Smoke check deployment image
        run: |
          docker run -d --name chess-challenge-ci -p 8080:8000 chess-model-challenge:ci
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2) as response:
                      assert json.load(response)['service'] == 'chess-model-challenge'
                  with urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2) as response:
                      assert b'<div id="root">' in response.read()
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Container diagnostics
        if: failure()
        run: docker logs chess-challenge-ci || true
      - name: Stop smoke check container
        if: always()
        run: docker rm -f chess-challenge-ci || true
